name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run lint:styles
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

      - name: PRD test queries
        run: npm run test:queries

      - name: Semantic search with the real model
        run: npm run test:semantic

      - name: Install Playwright's Chrome
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (on the built app)
        run: npm run test:e2e

      - name: Upload the Playwright report if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
